<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的花园">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>我的花园 · 大悟种植手册</title>
<style>
:root{
  --green:#2e7d32; --green-d:#1b5e20; --green-l:#e8f5e9;
  --bg:#f2f7f2; --card:#ffffff; --line:#e0e8e0;
  --txt:#263238; --txt2:#607d8b;
  --flower:#ec407a; --flower-l:#fde3ec;
  --fruit:#fb8c00; --fruit-l:#ffe8cc;
  --plant:#43a047; --plant-l:#dff3e0;
  --amber:#f59e0b; --amber-l:#fef3d9;
  --red:#c62828; --red-l:#fde8e8;
  --orange:#e64a19;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
#app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
header{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(46,125,50,.25)}
header .h-l{display:flex;align-items:center;gap:10px}
header .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px}
header h1{font-size:17px;font-weight:600;letter-spacing:.5px}
header .sub{font-size:11px;opacity:.85;margin-top:1px}
header .h-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}
#pwa-tip{display:none;align-items:center;gap:8px;background:#e8f5e9;border-bottom:1px solid #c8e6c9;padding:9px 14px;font-size:12.5px;color:#2e7d32}
#pwa-tip #pwa-tip-text{flex:1;min-width:0}
#pwa-tip #pwa-install{background:#2e7d32;color:#fff;border:none;border-radius:14px;padding:5px 16px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
#pwa-tip #pwa-x{color:#81c784;cursor:pointer;padding:2px 4px;font-size:13px}
main{padding:12px 12px 84px}
.tab-page{display:none}.tab-page.active{display:block}
/* ---------- chips & search ---------- */
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search-box input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--txt)}
.search-box .ic{font-size:16px;opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--txt2);cursor:pointer;white-space:nowrap;transition:.15s}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.chip .cnt{font-size:11px;opacity:.75;margin-left:2px}
/* ---------- plant cards ---------- */
.plant-list{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;transition:.15s;display:flex;gap:11px;align-items:stretch}
.pcard:active{transform:scale(.985)}
.pcard .pthumb{width:86px;min-width:86px;height:86px;border-radius:10px;background:linear-gradient(135deg,#f1f8e9,#dcedc8);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;align-self:center}
.pcard .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pthumb .pthumb-fb{font-size:30px;font-weight:600;color:#558b2f;opacity:.55;letter-spacing:-1px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.pcard .pthumb .pthumb-cat{position:absolute;top:4px;left:4px;font-size:9px;color:#fff;background:rgba(60,80,40,.55);padding:2px 5px;border-radius:4px;backdrop-filter:blur(4px)}
.pcard .pthumb .pthumb-dot{position:absolute;bottom:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(86,139,47,.85)}
.pcard .pthumb .pthumb-mine{position:absolute;bottom:4px;right:4px;font-size:9px;color:#fff;background:rgba(230,81,0,.8);padding:1.5px 5px;border-radius:4px;backdrop-filter:blur(4px)}
.pcard .pbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
/* 添加植物按钮 */
.fab{display:block;margin:4px 4px 12px;background:var(--green);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(46,125,50,.28);transition:.15s}
.fab:active{transform:scale(.97)}
/* 月份多选 */
.monpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.monpick .mp{text-align:center;padding:7px 0;border-radius:8px;background:#eceff1;color:var(--txt2);font-size:12.5px;cursor:pointer;border:1.5px solid transparent;user-select:none}
.monpick .mp.on{background:var(--green-l);color:var(--green-d);border-color:var(--green);font-weight:600}
.pcard .pthumb .pthumb-mine{position:absolute;bottom:6px;right:6px;font-size:10px;color:#fff;background:rgba(230,81,0,.75);padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px)}
.pcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.pcard .nm{font-size:16px;font-weight:600}
.pcard .cat{font-size:11px;color:var(--txt2);background:var(--green-l);padding:2px 8px;border-radius:6px;margin-left:8px}
.badge{font-size:11px;padding:2.5px 9px;border-radius:999px;font-weight:500;flex:0 0 auto}
.b-suit{background:var(--plant-l);color:var(--green-d)}
.b-protect{background:var(--amber-l);color:#b45309}
.b-strict{background:var(--fruit-l);color:#c2410c}
.b-indoor{background:var(--red-l);color:var(--red)}
.b-ok{background:#eceff1;color:#546e7a}
.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:2px}
.mstrip i{height:8px;border-radius:2px;background:#eceff1;display:block}
.mstrip i.f{background:var(--flower)}.mstrip i.u{background:var(--fruit)}.mstrip i.p{background:var(--plant)}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:2px}
.mlabels span{font-size:8.5px;text-align:center;color:#b0bec5}
.minfo{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--txt2);flex-wrap:wrap}
.minfo b{color:var(--flower);font-weight:500}.minfo .fr b{color:var(--fruit)}.minfo .pl b{color:var(--plant)}
/* ---------- detail overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;border-radius:18px 18px 0 0;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#cfd8dc;margin:8px auto 2px}
.sheet .close-x{position:sticky;top:8px;float:right;margin:8px 12px 0 0;width:30px;height:30px;border-radius:50%;border:none;background:#eceff1;color:var(--txt2);font-size:14px;cursor:pointer;z-index:5}
.d-hero{position:relative;width:calc(100% + 36px);margin:0 -18px 8px;aspect-ratio:16/9;background:linear-gradient(135deg,#f1f8e9,#c8e6c9);overflow:hidden;display:flex;align-items:center;justify-content:center;max-height:280px}
.d-hero img{width:100%;height:100%;object-fit:cover;display:block}
.d-hero .d-hero-fb{font-size:78px;font-weight:600;color:#558b2f;opacity:.55;letter-spacing:-2px;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.d-hero .d-hero-cat{position:absolute;top:14px;left:14px;color:#fff;background:rgba(50,70,30,.55);padding:5px 11px;border-radius:7px;font-size:12px;backdrop-filter:blur(6px)}
.d-hero .d-hero-tip{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:6px;font-size:11px;backdrop-filter:blur(6px)}
.d-photo-btn{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border:none;padding:8px 13px;border-radius:8px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);font-weight:500}
.d-photo-btn:active{transform:scale(.96);background:rgba(0,0,0,.7)}
.d-photo-del{position:absolute;bottom:10px;left:10px;background:rgba(180,40,40,.65);color:#fff;border:none;padding:7px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;backdrop-filter:blur(8px)}
.d-head{padding:8px 18px 14px;border-bottom:1px solid var(--line)}
.d-head .t{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-head .s{font-size:12px;color:var(--txt2);margin-top:4px}
.d-sec{padding:14px 18px 4px}
.d-sec h3{font-size:13.5px;color:var(--green-d);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.d-sec h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--green)}
/* calendar grid in detail */
.calgrid{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.calrow{display:grid;grid-template-columns:52px repeat(12,1fr);gap:2px;margin-bottom:2px;align-items:center}
.calrow .lbl{font-size:11px;color:var(--txt2);padding-right:4px}
.calrow .lbl b{font-size:12px}
.calrow i{height:20px;border-radius:4px;background:#eceff1;display:block;position:relative}
.calrow i.f{background:var(--flower-l)}.calrow i.u{background:var(--fruit-l)}.calrow i.p{background:var(--plant-l)}
.calrow .mon{font-size:9px;text-align:center;color:#b0bec5}
.calrow i.cur{outline:2px solid var(--green);outline-offset:-1px}
.callegend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--txt2);flex-wrap:wrap}
.callegend span{display:flex;align-items:center;gap:4px}
.callegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.info-list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info-list .row{display:flex;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px;font-size:13.5px;line-height:1.55}
.info-list .row:last-child{border-bottom:none}
.info-list .k{flex:0 0 64px;color:var(--txt2);font-size:12.5px}
.info-list .v{flex:1}
.pest-chips{display:flex;flex-wrap:wrap;gap:7px}
.pest-chip{padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;border:1px solid}
.pc-虫害{background:#fff8f0;border-color:#f6c58a;color:#b45309}
.pc-病害{background:#f4f9ff;border-color:#a9cdef;color:#1d6fb8}
.pc-生理{background:#f3f9f3;border-color:#b5dfb8;color:#2e7d32}
.d-actions{display:flex;gap:10px;padding:6px 18px 24px}
.btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer}
.btn-p{background:var(--green);color:#fff}.btn-o{background:var(--card);border:1.5px solid var(--green);color:var(--green)}
/* ---------- calendar tab ---------- */
.seg{display:flex;background:#e2eee3;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:8px;font-size:14px;color:var(--txt2);border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--green-d);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mon-pills{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}
.mpill{padding:9px 4px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:14px;text-align:center;cursor:pointer;color:var(--txt2)}
.mpill.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.mpill small{display:block;font-size:10px;opacity:.75}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.mcard h4{font-size:14px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.mcard h4 .dot{width:8px;height:8px;border-radius:50%}
.nmchips{display:flex;flex-wrap:wrap;gap:6px}
.nmchip{padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;border:1px solid}
.nc-f{background:var(--flower-l);border-color:#f5b6cf;color:#b3416b}
.nc-u{background:var(--fruit-l);border-color:#f5c48e;color:#a85a05}
.nc-p{background:var(--plant-l);border-color:#a8d8ab;color:#2e6b32}
.nc-x{background:#f4f9ff;border-color:#a9cdef;color:#1d6fb8}
.tips li{font-size:13.5px;line-height:1.65;color:#37474f;margin:0 0 7px 18px}
.tips li::marker{color:var(--green)}
.clim{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:1px solid #c5e1a5;border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:12.5px;line-height:1.7;color:#33691e}
.clim b{font-size:13.5px}
/* year table */
.ytable-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ytable-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.yrow{display:flex;border-bottom:1px solid #eef2ee;align-items:stretch}
.yrow.head{position:sticky;top:0;background:#f7faf7;font-size:10.5px;color:var(--txt2);font-weight:500}
.yrow:last-child{border-bottom:none}
.ynm{flex:0 0 92px;font-size:12px;padding:0 8px;display:flex;align-items:center;border-right:1px solid #eef2ee;line-height:1.3}
.yrow.head .ynm{font-size:11px;justify-content:center}
.ycells{display:grid;grid-template-columns:repeat(12,1fr);flex:1}
.ycell{height:26px;border-right:1px solid #f2f5f2;position:relative}
.ycell:last-child{border-right:none}
.ycell-h{display:flex;align-items:center;justify-content:center;font-size:10px;color:#78909c}
.ycell:not(.ycell-h)::after{content:"";position:absolute;inset:3px 2.5px;border-radius:3px;background:#eceff1}
.ycell.f::after{background:var(--flower)}.ycell.u::after{background:var(--fruit)}.ycell.p::after{background:var(--plant)}.ycell.fp::after{background:linear-gradient(90deg,var(--flower) 50%,var(--fruit) 50%)}.ycell.pf::after{background:linear-gradient(90deg,var(--plant) 50%,var(--flower) 50%)}
.yrow.curmon .ycell:nth-child(var(--cm)){background:#e8f5e9}
/* ---------- diary ---------- */
.diary-top{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.dsearch{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;outline:none;color:var(--txt)}
.addbtn{flex:0 0 auto;background:var(--green);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.dentry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.dentry .eh{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.dentry .dt{font-size:12px;color:var(--txt2)}
.dentry .pl-nm{font-size:14.5px;font-weight:600;color:var(--green-d);cursor:pointer}
.stage-b{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-weight:500}
.dentry .txt{font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:#37474f}
.dentry .del{margin-left:auto;border:none;background:#eceff1;color:#b0bec5;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px}
.dmedia{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.dmedia .m-item{position:relative;border-radius:10px;overflow:hidden;background:#eceff1}
.dmedia img,.dmedia video{width:100%;height:88px;object-fit:cover;display:block}
.dmedia .vtag{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}
.dentry .ft{margin-top:8px;font-size:11px;color:#b0bec5}
/* 以植物为主体的日记分组 */
.dgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dgroup .dg-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.dgroup .dg-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#f1f8e9,#dcedc8);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dgroup .dg-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dgroup .dg-fb{font-size:19px;color:#558b2f;opacity:.6;font-weight:600}
.dg-main{flex:1;min-width:0}
.dg-nm{font-size:14.5px;font-weight:600;color:var(--green-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-meta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.dg-dt{font-size:11.5px;color:var(--txt2)}
.dg-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.dg-day{font-size:11px;color:#90a4ae}
.dg-caret{font-size:11px;color:#b0bec5;transition:.2s}
.dgroup.open .dg-caret{transform:rotate(180deg)}
.dg-body{padding:10px 13px 12px;border-top:1px solid var(--line)}
.dg-add{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dg-add button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.dg-add .lnk{background:#e8f5e9;color:var(--green-d);font-weight:500}
.timeline{position:relative;padding-left:14px}
.timeline::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:#e8f5e9;border-radius:2px}
.tl-item{position:relative;margin-bottom:10px}
.tl-dot{position:absolute;left:-14px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
.tl-card{background:#fafcf9;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tl-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.tl-dt{font-size:12px;color:var(--txt2)}
.tl-gap{font-size:11px;color:#7cb342;background:#f1f8e9;border-radius:999px;padding:1px 7px}
.tl-no{font-size:11px;color:#fff;background:var(--green);border-radius:999px;padding:1px 8px;font-weight:600}
.dg-tip{font-size:11px;color:#b0bec5;margin-left:auto}
.tl-act{margin-left:auto;display:flex;gap:5px}
.tl-act button{border:none;background:#eceff1;color:#78909c;width:27px;height:27px;border-radius:7px;font-size:12px;cursor:pointer}
/* 植物名搜索建议 */
.sug{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:220px;overflow:auto;margin-top:5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sug-t{font-size:11px;color:#90a4ae;padding:7px 12px 4px}
.sug-i{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f5f7f5}
.sug-i:active{background:#f1f8e9}
.sug-new{color:var(--green-d);font-weight:600}
.f-hint{font-size:11px;color:#e65100;margin-top:5px}
.empty{text-align:center;padding:44px 20px;color:#90a4ae;font-size:13.5px;line-height:1.8}
.empty .e-ic{font-size:40px;margin-bottom:8px}
/* form */
.f-sec{margin-bottom:13px}
.f-sec label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:5px}
.f-sec input[type=date],.f-sec select,.f-sec textarea,.f-sec input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:inherit;background:var(--card);color:var(--txt);outline:none}
.f-sec textarea{min-height:92px;resize:vertical;line-height:1.6}
.f-sec textarea:focus,.f-sec input:focus,.f-sec select:focus{border-color:var(--green)}
.fup{display:flex;flex-wrap:wrap;gap:7px}
.fup .ph{width:64px;height:64px;border-radius:10px;border:1.5px dashed #b0bec5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#90a4ae;cursor:pointer;gap:2px;background:var(--card)}
.fup .ph span{font-size:20px}
.fup .pre{width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;background:#eceff1}
.fup .pre img,.fup .pre video{width:100%;height:100%;object-fit:cover}
.fup .pre .rm{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:10px;cursor:pointer;line-height:1}
.stage-pick{display:flex;flex-wrap:wrap;gap:6px}
.stage-pick .schip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--txt2);cursor:pointer}
.stage-pick .schip.on{background:var(--green);border-color:var(--green);color:#fff}
/* ---------- pests ---------- */
.pest-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pest-card .ph{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pest-card .nm{font-size:15.5px;font-weight:600;flex:1}
.t-b{font-size:11px;padding:2px 9px;border-radius:6px;font-weight:500}
.tb-虫害{background:#fff3e0;color:#e65100}
.tb-病害{background:#e3f2fd;color:#1565c0}
.tb-生理{background:#e8f5e9;color:#2e7d32}
.pest-card .ss{font-size:12.5px;color:var(--txt2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pest-card .se{font-size:11px;color:#b0bec5;margin-top:5px}
.drug-tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drug-tbl .dr{display:flex;padding:10px 13px;border-bottom:1px solid var(--line);gap:10px;font-size:13px;line-height:1.55}
.drug-tbl .dr:last-child{border-bottom:none}
.drug-tbl .dn{flex:0 0 44%;font-weight:600;color:var(--green-d)}
.drug-tbl .du{flex:1;color:#455a64}
.org-list li,.prev-list li{font-size:13px;line-height:1.65;margin:0 0 6px 18px;color:#37474f}
.org-list li::marker{content:"🌿 "}
.prev-list li::marker{content:"✓ ";color:var(--green)}
.mon-tag{display:inline-block;padding:3px 8px;border-radius:6px;background:#eceff1;color:#546e7a;font-size:11.5px;margin:0 4px 5px 0}
/* ---------- settings modal ---------- */
.set-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.set-mask.show{display:flex}
.set-card{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.set-card h3{font-size:16px;margin-bottom:12px;color:var(--green-d)}
.set-card p{font-size:13px;line-height:1.7;color:#546e7a;margin-bottom:12px}
.set-card .btn{width:100%;margin-bottom:9px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(38,50,56,.92);color:#fff;padding:9px 20px;border-radius:999px;font-size:13.5px;z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1}
/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:8px 0 9px;font-size:10.5px;color:#90a4ae;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ni{font-size:21px;line-height:1}
nav button.on{color:var(--green);font-weight:600}
@media(min-width:600px){#app{margin-top:0} .mpill{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="h-l">
      <div class="logo">🌻</div>
      <div>
        <h1>我的花园</h1>
        <div class="sub">湖北孝感·大悟县气候适配</div>
      </div>
    </div>
    <button class="h-btn" onclick="openSettings()" title="备份与设置">⚙️</button>
  </header>

  <div id="pwa-tip">
    <span id="pwa-tip-text">把「我的花园」安装到手机桌面，离线也能用</span>
    <button id="pwa-install" onclick="doInstall()">安装</button>
    <span id="pwa-x" onclick="hidePwaTip(true)">✕</span>
  </div>

  <main>
    <!-- ============ 图鉴 ============ -->
    <section id="page-catalog" class="tab-page active">
      <div class="search-box"><span class="ic">🔍</span><input id="q" placeholder="搜索植物名称 / 习性 / 光照…" oninput="renderCatalog()"></div>
      <div id="photo-stat" style="font-size:12px;color:var(--txt2);margin:-4px 4px 8px;display:flex;align-items:center;gap:6px"></div>
      <button class="fab" onclick="openPlantForm()" title="添加新植物">＋ 添加植物</button>
      <div class="chips" id="cat-chips"></div>
      <div class="chips" id="lvl-chips"></div>
      <div class="plant-list" id="plant-list"></div>
    </section>

    <!-- ============ 日历 ============ -->
    <section id="page-cal" class="tab-page">
      <div class="seg">
        <button id="seg-m" class="on" onclick="calMode('m')">月历提醒</button>
        <button id="seg-y" onclick="calMode('y')">全年总览表</button>
      </div>
      <div id="cal-month">
        <div class="clim" id="clim-card"></div>
        <div class="mon-pills" id="mon-pills"></div>
        <div id="mon-detail"></div>
      </div>
      <div id="cal-year" style="display:none">
        <div class="chips" id="y-chips"></div>
        <div class="calgrid" style="padding:10px">
          <div class="callegend" style="margin:0 0 8px"><span><i style="background:var(--plant)"></i>可种植</span><span><i style="background:var(--flower)"></i>开花</span><span><i style="background:var(--fruit)"></i>结果</span><span><i style="background:linear-gradient(90deg,var(--plant) 50%,var(--flower) 50%)"></i>种植+开花</span></div>
        </div>
        <div class="ytable-wrap"><div class="ytable-scroll"><div id="ytable"></div></div></div>
      </div>
    </section>

    <!-- ============ 日记 ============ -->
    <section id="page-diary" class="tab-page">
      <div class="diary-top">
        <input class="dsearch" id="dq" placeholder="搜索植物名或记录内容…" oninput="renderDiary()">
        <button class="addbtn" onclick="openDiaryForm()">＋ 记一笔</button>
      </div>
      <div id="diary-list"></div>
    </section>

    <!-- ============ 防治 ============ -->
    <section id="page-pest" class="tab-page">
      <div class="search-box"><span class="ic">🔍</span><input id="pq" placeholder="搜索病虫害 / 症状 / 药剂…" oninput="renderPests()"></div>
      <div class="chips" id="pt-chips"></div>
      <div id="pest-list"></div>
    </section>
  </main>

  <nav>
    <button id="nav-catalog" class="on" onclick="go('catalog')"><span class="ni">🌿</span>植物图鉴</button>
    <button id="nav-cal" onclick="go('cal')"><span class="ni">📅</span>种植日历</button>
    <button id="nav-diary" onclick="go('diary')"><span class="ni">📖</span>种植日记</button>
    <button id="nav-pest" onclick="go('pest')"><span class="ni">🛡️</span>病虫防治</button>
  </nav>
</div>

<!-- detail sheet -->
<div class="overlay" id="ovl" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<!-- diary form -->
<div class="overlay" id="fov" onclick="if(event.target===this)closeForm(false)">
  <div class="sheet" id="fsheet"></div>
</div>
<!-- settings -->
<div class="set-mask" id="setmask" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="set-card">
    <h3>⚙️ 设置与备份</h3>
    <p>日记数据保存在本设备的浏览器中（IndexedDB），换设备或清理浏览器前请先导出备份。</p>
    <button class="btn btn-p" onclick="exportData()">📦 导出备份（含图片视频）</button>
    <button class="btn btn-o" onclick="document.getElementById('imp').click()">📥 导入恢复</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)">
    <p style="margin-top:14px;font-size:12px;color:#90a4ae">💡 手机使用：用浏览器打开本页面后，通过浏览器菜单「添加到主屏幕」，即可像小程序一样全屏使用。</p>
    <button class="btn" style="background:#eceff1;color:#546e7a" onclick="document.getElementById('setmask').classList.remove('show')">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

        </div>
        <div class="mstrip">${MSTRIP(p)}</div>
        <div class="minfo">
          ${p.flower.length?`<span>🌸 <b>${fmtM(p.flower)}</b>开花</span>`:""}
          ${p.fruit.length?`<span class="fr">🍊 <b>${fmtM(p.fruit)}</b>结果</span>`:""}

function MSTRIP(p){
  let h="";
  for(let m=1;m<=12;m++){
    let c = p.flower.includes(m)?"f":(p.fruit.includes(m)?"u":(p.plant.includes(m)?"p":""));
    h+=`<i class="${c}"></i>`;
  }
  return h;
}
function fmtM(arr){
  if(!arr||!arr.length)return"";
  if(arr.length===12)return"全年";
  const s=[...arr].sort((a,b)=>a-b);
  if(s[s.length-1]-s[0]===s.length-1)
    return s.length===1?MARR[s[0]]:MARR[s[0]]+"-"+MARR[s[s.length-1]];
  // 跨年区间检测：环形上仅一个断口 → 单一跨年区间
  const gaps=[];
  for(let i=0;i<s.length-1;i++) if(s[i+1]-s[i]>1) gaps.push(i);
  const wrapGap = (12-s[s.length-1]+s[0])>1;
  if(gaps.length + (wrapGap?1:0) === 1){
    if(gaps.length===1){const g=gaps[0];return MARR[s[g+1]]+"至次年"+MARR[s[g]];}
    return MARR[s[0]]+"至次年"+MARR[s[s.length-1]];
  }
  // 多段
  const segs=[];let st=s[0],prev=s[0];
  for(let i=1;i<s.length;i++){
    if(s[i]!==prev+1){segs.push(st===prev?MARR[st]:MARR[st]+"-"+MARR[prev]);st=s[i];}
    prev=s[i];
  }
  segs.push(st===prev?MARR[st]:MARR[st]+"-"+MARR[prev]);
  return segs.join("、");
}

function idbOpen(){

    let rq;
    try{rq=indexedDB.open("gardenApp",1);}catch(e){idbOK=false;return res();}
    rq.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains("diary"))d.createObjectStore("diary",{keyPath:"id"});
      if(!d.objectStoreNames.contains("media"))d.createObjectStore("media",{keyPath:"id"});

function idbAll(store){return new Promise((res,rej)=>{const rq=db.transaction(store).objectStore(store).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function idbPut(store,v){return new Promise((res,rej)=>{const rq=db.transaction(store,"readwrite").objectStore(store).put(v);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function idbDel(store,k){return new Promise((res,rej)=>{const rq=db.transaction(store,"readwrite").objectStore(store).delete(k);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function idbGet(store,k){return new Promise((res,rej)=>{const rq=db.transaction(store).objectStore(store).get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}

/* 图片压缩到最大边 1200px、JPEG 0.85，省 IDB 空间 */
async function compressImg(file, maxSide=1200, quality=0.85){
  if(!file.type.startsWith("image/")) return file;
  const img = await new Promise((res,rej)=>{
    const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);
  });
  let w=img.width, h=img.height;
  if(Math.max(w,h)>maxSide){
    if(w>=h){h=Math.round(h*maxSide/w);w=maxSide;}
    else{w=Math.round(w*maxSide/h);h=maxSide;}
  }
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(img,0,0,w,h);
  return new Promise(res=>cv.toBlob(b=>res(b||file),'image/jpeg',quality));
}
function pickPlantPhoto(name){
  return new Promise(res=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f){return res(false);}
      try{
        if(f.size>5*1024*1024){toast("原图较大，正在压缩…");}
        const blob=await compressImg(f);
        const ok=await setPlantPhoto(name, blob);
        if(ok) toast("已更新 ✨");
        res(true);
      }catch(e){toast("图片处理失败");res(false);}
    };
    inp.click();
  });
}

  await delPlantPhoto(name);

}

function pickMon(id){return [...document.querySelectorAll(`#${id} .mp.on`)].map(x=>+x.dataset.m);}
function catToTag(cat){
  cat = cat||"";
  if(cat.includes("果树"))return "果树";
  if(cat.includes("乔木"))return "乔木";
  if(cat.includes("球根"))return "球根";
  if(cat.includes("香草"))return "香草";
  if(cat.includes("灌木"))return "灌木";
  if(cat.includes("藤本"))return "藤本";
  if(cat.includes("地被"))return "地被";
  if(cat.includes("水生"))return "宿根";
  if(cat.includes("多肉"))return "观叶";
  return "草花";
}

function plantSugList(kw){
  const k=(kw||"").trim().toLowerCase();
  if(!k){
    const recent=[];
    entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
      if(!recent.includes(e.plant))recent.push(e.plant);});
    return recent.slice(0,12);
  }
  const m=PLANTS.map(p=>p.name).filter(n=>n.toLowerCase().includes(k));
  m.sort((a,b)=>a.toLowerCase().indexOf(k)-b.toLowerCase().indexOf(k)||a.localeCompare(b,"zh"));
  return m.slice(0,40);
}

function buildGroups(){

  let gs=[...map.entries()].map(([plant,list])=>{
    const ls=list.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created));
    return {plant,list:ls,latest:ls[ls.length-1],count:ls.length};
  });
  if(q)gs=gs.filter(g=>g.plant.includes(q)||g.list.some(e=>(e.text||"").includes(q)||(e.stage||"").includes(q)));
  gs.sort((a,b)=>b.latest.date.localeCompare(a.latest.date));
  return gs;
}

            const idx=g.list.indexOf(e), prev=idx>0?g.list[idx-1]:null;

              <div class="tl-h">

/* 备份 */
function blobToB64(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});}
async function exportData(){
  if(!entries.length && !customPlants.length){toast("还没有日记或自定义植物可导出");return;}
  const out={version:2,exported:new Date().toISOString(),entries:[],customPlants:[]};
  for(const e of entries){
    const ne={...e,mediaData:[]};
    for(const mid of (e.mediaIds||[])){
      const rec=await idbGet("media",mid);
      if(rec)ne.mediaData.push({name:rec.name,type:rec.type,data:await blobToB64(rec.blob)});
    }
    out.entries.push(ne);
  }
  // 自定义植物
  for(const cp of customPlants){
    const rec=await idbGet("customPlants",cp.name);
    if(rec)out.customPlants.push(rec);
  }
  // 用户上传的照片（覆盖 Excel 原图的）
  out.photos=[];
  for(const nm of Object.keys(userPhotos)){
    const rec=await idbGet("plantPhotos",nm);
    if(rec&&rec.blob)out.photos.push({name:nm,data:await blobToB64(rec.blob)});
  }
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="花园数据备份_"+new Date().toISOString().slice(0,10)+".json";
  a.click();toast("备份已导出 📦");
}
async function importData(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data.entries && !data.customPlants)throw 0;
    let n=0,nc=0,np=0;
    for(const e of (data.entries||[])){
      const mediaIds=[];
      for(const md of (e.mediaData||[])){
        const blob=await (await fetch(md.data)).blob();
        const id="m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
        await idbPut("media",{id,name:md.name,type:md.type,blob});
        mediaIds.push(id);
      }
      const {mediaData,...rest}=e;
      await idbPut("diary",{...rest,mediaIds,id:"e_"+Date.now()+"_"+(n++)});
    }
    for(const cp of (data.customPlants||[])){
      await idbPut("customPlants",cp);nc++;
    }
    for(const ph of (data.photos||[])){
      const blob=await (await fetch(ph.data)).blob();
      await idbPut("plantPhotos",{name:ph.name,blob});np++;
    }
    if(nc)  {customPlants=(data.customPlants||[]).map(x=>x);customPlants.forEach(mergeCustom);}
    if(np)  {(data.photos||[]).forEach(async ph=>{const b=await(await fetch(ph.data)).blob();plantPhotos[ph.name]=URL.createObjectURL(b);userPhotos[ph.name]=true;});}
    await loadDiary();renderDiary();renderCatalog();renderCal();
    toast(`已导入：${n} 条日记、${nc} 种植物、${np} 张照片 📥`);
  }catch(err){toast("导入失败：文件格式不正确");}
  inp.value="";
}

/* ================= 病虫害 ================= */
let curType="全部";
function renderPests(){
  const types=["全部","虫害","病害","生理"];
  $("#pt-chips").innerHTML=types.map(t=>{const c=t==="全部"?PESTS.length:PESTS.filter(x=>x.type===t).length;
    return `<div class="chip ${curType===t?'on':''}" onclick="curType='${t}';renderPests()">${t}<span class="cnt">${c}</span></div>`;}).join("");
  const q=$("#pq").value.trim().toLowerCase();
  const list=PESTS.filter(x=>(curType==="全部"||x.type===curType)&&
    (!q||(x.name+x.symptom+x.season+x.drugs.map(d=>d.name+d.usage).join()+x.susceptible).toLowerCase().includes(q)));
  $("#pest-list").innerHTML = list.length?list.map(x=>`
    <div class="pest-card" onclick="openPest(${PESTS.indexOf(x)})">
      <div class="ph"><span class="nm">${x.type==="虫害"?"🐛":x.type==="病害"?"🦠":"🌡️"} ${x.name}</span><span class="t-b tb-${x.type}">${x.type}</span></div>
      <div class="ss">${x.symptom}</div>
      <div class="se">⏰ ${x.season}</div>
    </div>`).join(""):`<div class="empty"><div class="e-ic">🔍</div>没有匹配的条目</div>`;
}
function openPest(i){
  const x=PESTS[i];if(!x)return;
  const icon=x.type==="虫害"?"🐛":x.type==="病害"?"🦠":"🌡️";
  $("#sheet").innerHTML=`
    <div class="grab"></div><button class="close-x" onclick="closeSheet()">✕</button>
    <div class="d-head"><div class="t">${icon} ${x.name} <span class="t-b tb-${x.type}">${x.type}</span></div>
      <div class="s">高发期：${x.months.map(m=>m+"月").join("、")}</div></div>
    <div class="d-sec"><h3>⏰ 发生规律</h3><div class="info-list"><div class="row"><div class="v">${esc(x.season)}</div></div></div></div>
    <div class="d-sec"><h3>🔍 症状识别</h3><div class="info-list"><div class="row"><div class="v">${esc(x.symptom)}</div></div></div></div>
    <div class="d-sec"><h3>🎯 易感植物</h3><div class="pest-chips">${x.susceptible.split("、").map(s=>`<span class="pest-chip pc-${x.type==="虫害"?"虫害":(x.type==="病害"?"病害":"生理")}" style="cursor:default">${s}</span>`).join("")}</div></div>
    <div class="d-sec"><h3>💊 药物防治</h3><div class="drug-tbl">${x.drugs.map(d=>`<div class="dr"><div class="dn">${esc(d.name)}</div><div class="du">${esc(d.usage)}</div></div>`).join("")}</div></div>
    <div class="d-sec"><h3>🌿 有机 / 家庭方案</h3><ul class="org-list">${x.organic.map(o=>`<li>${o}</li>`).join("")}</ul></div>
    <div class="d-sec"><h3>🛡️ 预防要点</h3><ul class="prev-list">${x.prevention.map(o=>`<li>${o}</li>`).join("")}</ul></div>
    <div style="height:20px"></div>`;
  $("#ovl").classList.add("show");$("#sheet").scrollTop=0;
}

/* ================= nav & init ================= */
function go(t){
  document.querySelectorAll(".tab-page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  $("#page-"+t).classList.add("active");$("#nav-"+t).classList.add("on");
  window.scrollTo(0,0);
}
function openSettings(){$("#setmask").classList.add("show");}
/* ---------- PWA 安装 ---------- */
let deferredInstall=null;
function pwaHidden(){return localStorage.getItem("pwaTipHide")==="1";}
function pwaInstalled(){
  return window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone===true;
}
function showPwaTip(canInstall){
  if(pwaHidden()||pwaInstalled())return;
  const el=$("#pwa-tip");el.style.display="flex";
  if(canInstall){
    $("#pwa-install").style.display="";
    $("#pwa-tip-text").textContent="把「我的花园」安装到手机桌面，离线也能用";
  }else{
    $("#pwa-install").style.display="none";
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    $("#pwa-tip-text").textContent=isIOS
      ?"iPhone 请用 Safari 打开 → 分享按钮 → 添加到主屏幕"
      :"请用 Chrome/Edge 打开本页，点浏览器菜单「添加到主屏幕/安装应用」";
  }
}
function hidePwaTip(manual){
  if(manual)localStorage.setItem("pwaTipHide","1");
  $("#pwa-tip").style.display="none";
}
async function doInstall(){
  if(!deferredInstall){toast("请用浏览器菜单「添加到主屏幕」");return;}
  deferredInstall.prompt();
  const r=await deferredInstall.userChoice;
  if(r.outcome==="accepted"){toast("正在安装到桌面 📲");hidePwaTip();}
  deferredInstall=null;
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstall=e;
  showPwaTip(true);
});
window.addEventListener("appinstalled",()=>{
  deferredInstall=null;
  localStorage.setItem("pwaTipHide","1");
  hidePwaTip();
  toast("已安装到桌面 🌻");
});
(async function init(){
  renderCatalog();renderCal();renderPests();
  try{await idbOpen();await loadAllPhotos();await loadCustomPlants();await loadDiary();}catch(e){console.warn(e);}
  if(entries.length){const g=buildGroups();if(g.length)openGroups.add(g[0].plant);}
  renderCatalog();   // 重新渲染以应用加载到的照片和自定义植物
  renderCal();renderDiary();
  setupSW();
  // 3 秒后仍未触发安装事件，显示通用引导提示
  setTimeout(()=>{if(!deferredInstall)showPwaTip(false);},3000);
})();
/* ---------- 版本更新：关闭重开自动加载最新版 ---------- */
function setupSW(){
  if(!("serviceWorker" in navigator)||!location.protocol.startsWith("http"))return;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.update();
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          toast("已更新到最新版本 ✅");
          setTimeout(()=>location.reload(),900);
        }
      });
    });
  }).catch(()=>{});
  // 从后台切回前台时检查更新
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){
      navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
    }
  });
}
</script>
